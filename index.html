<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>clipd</title>
<style>body{font:16px system-ui,sans-serif;background:#0d0d12;color:#ececf3;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#9d7bff}</style>
</head>
<body>
<!--
  clipd's way back from TikTok (Login Kit). TikTok wants an HTTPS
  redirect URI; this static page (GitHub Pages) sends the browser on to
  the dashboard on the local network, with TikTok's parameters (code,
  state). The code is single use and worthless without the app secret,
  which stays on the Pi. Change DASHBOARD if the dashboard has another
  address.
-->
<p id="msg">Retour vers clipd…</p>
<script>
  var DASHBOARD = "http://clipd.local";
  var target = DASHBOARD + "/tiktok/callback" + window.location.search;
  document.getElementById("msg").innerHTML =
    'Retour vers clipd… <a id="go">continuer</a>';
  document.getElementById("go").href = target;
  window.location.replace(target);
</script>
<noscript><p>Active JavaScript, ou ouvre clipd et recommence la connexion.</p></noscript>
</body>
</html>
